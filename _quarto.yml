project:
  type: website
  output-dir: _site
  resources:
    - googleef02c443fa87502b.html
    - assets/time-theme.js

website:
  title: "Economía y Políticas Públicas"
  description: "Hub de información económica sobre Chile y el mundo"
  site-url: "https://economia-y-politicas-publicas.github.io/chiledatos"
  open-graph: true
  twitter-card: true
  navbar:
    background: light
    foreground: dark
    left:
      - href: index.qmd
        text: Inicio
      - href: pages/noticias/index.qmd
        text: "Noticias"
      - href: pages/economia.qmd
        text: Economía
      - href: pages/finanzas_publicas.qmd
        text: Finanzas Públicas
      - href: pages/Inflacion.qmd
        text: "Inflación"
      - href: pages/trabajo.qmd
        text: Mercado Laboral
      - href: pages/riesgo_pais.qmd
        text: "Riesgo País"
      - href: pages/indicadores_vivo.qmd
        text: "📡 Indicadores en Vivo"
      - href: pages/Cepal.qmd
        text: "América Latina y el Caribe"
      - href: pages/Donaciones.qmd
        text: "Donaciones"
    right:
      - icon: github
        href: https://github.com/Economia-y-politicas-publicas/chiledatos
  page-footer:
    left: "© 2026 Economía y Políticas Públicas · Datos públicos de Chile"
    right:
      - icon: github
        href: https://github.com/Economia-y-politicas-publicas/chiledatos

format:
  html:
    lang: es
    include-in-header:
      - text: '<script src="/assets/time-theme.js"></script>'
    theme:
      light: [lux, styles/theme.scss, styles/theme-light.scss]
      dark: [lux, styles/theme.scss, styles/theme-dark.scss]
    title-block-banner: true
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    code-fold: true
    code-tools: true
    smooth-scroll: true
    highlight-style: github
    fig-width: 9
    fig-height: 5

execute:
  freeze: auto
  echo: false
  warning: false
  message: false
